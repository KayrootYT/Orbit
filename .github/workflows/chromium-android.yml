name: Orbit Chromium Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "chromium-build/**"
      - ".github/workflows/chromium-android.yml"

permissions:
  contents: read

concurrency:
  group: orbit-chromium-android-arm64
  cancel-in-progress: false

jobs:
  build-chromium:
    name: Build Chromium ARM64 APK
    runs-on: [self-hosted, linux, x64, chromium-builder]
    timeout-minutes: 360

    steps:
      - name: Checkout Orbit repository
        uses: actions/checkout@v4

      - name: Check runner requirements
        shell: bash
        run: |
          set -euo pipefail
          echo "OS:"; uname -a
          echo "Memory:"; free -h
          echo "Disk:"; df -h "$HOME"

          FREE_GB=$(df -BG "$HOME" | awk 'NR==2 {gsub(/G/, "", $4); print $4}')
          if [ "${FREE_GB:-0}" -lt 100 ]; then
            echo "::error::At least 100 GB free disk space is recommended for Chromium."
            exit 1
          fi

          command -v git
          command -v python3

      - name: Build Chromium for Android ARM64
        shell: bash
        run: |
          set -euo pipefail
          chmod +x chromium-build/build_chromium_android.sh
          export ORBIT_CHROMIUM_ROOT="$HOME/orbit-chromium/src"
          echo "Chromium source directory: $ORBIT_CHROMIUM_ROOT"
          ./chromium-build/build_chromium_android.sh

      - name: Verify and stage APK
        shell: bash
        run: |
          set -euo pipefail
          CHROMIUM_ROOT="$HOME/orbit-chromium/src"
          APK="$CHROMIUM_ROOT/out/Orbit/apks/ChromePublic.apk"
          DEST="$GITHUB_WORKSPACE/orbit-artifacts"

          if [ ! -s "$APK" ]; then
            echo "::error::Chromium APK not found or empty: $APK"
            find "$CHROMIUM_ROOT/out/Orbit" -type f -name '*.apk' -print || true
            exit 1
          fi

          mkdir -p "$DEST"
          cp "$APK" "$DEST/Chromium-Android-ARM64.apk"
          sha256sum "$DEST/Chromium-Android-ARM64.apk"
          ls -lh "$DEST/Chromium-Android-ARM64.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Chromium-Android-ARM64
          path: orbit-artifacts/Chromium-Android-ARM64.apk
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        if: always()
        shell: bash
        run: |
          {
            echo "## Orbit Chromium Android ARM64"
            echo
            echo "- Build job status: ${{ job.status }}"
            echo "- Build target: chrome_public_apk"
            echo "- Architecture: arm64"
            echo
            echo "Note: upstream Chromium's APK is named Chromium-Android-ARM64.apk as an artifact."
            echo "Renaming the artifact does not rebrand Chromium or integrate Orbit's UI/privacy features."
          } >> "$GITHUB_STEP_SUMMARY"
