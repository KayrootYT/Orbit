name: Orbit Chromium Android Build

on:
workflow_dispatch:
push:
branches:
- main
paths:
- "chromium-build/**"
- ".github/workflows/chromium-android.yml"

permissions:
contents: read

concurrency:
group: orbit-chromium-build
cancel-in-progress: false

jobs:
build:
name: Build Chromium for Android ARM64
runs-on: [self-hosted, linux, x64, chromium-builder]
timeout-minutes: 360

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Verify build requirements
    shell: bash
    run: |
      set -euo pipefail

      echo "Operating system:"
      uname -a

      echo "Available memory:"
      free -h

      echo "Available disk:"
      df -h "$HOME"

      FREE_GB=$(df -BG "$HOME" | awk 'NR==2 {gsub(/G/, "", $4); print $4}')
      if [ "${FREE_GB:-0}" -lt 100 ]; then
        echo "::error::At least 100 GB of free disk space is recommended."
        exit 1
      fi

      command -v git
      command -v python3

  - name: Verify Chromium build script
    shell: bash
    run: |
      set -euo pipefail

      test -f chromium-build/build_chromium_android.sh || {
        echo "::error::chromium-build/build_chromium_android.sh is missing."
        exit 1
      }

      chmod +x chromium-build/build_chromium_android.sh

  - name: Build Chromium
    shell: bash
    run: |
      set -euo pipefail

      export ORBIT_CHROMIUM_ROOT="$HOME/orbit-chromium/src"

      ./chromium-build/build_chromium_android.sh

  - name: Verify generated Chromium APK
    id: verify
    shell: bash
    run: |
      set -euo pipefail

      BUILD_DIR="$HOME/orbit-chromium/src/out/Orbit"
      ARTIFACT_DIR="$GITHUB_WORKSPACE/orbit-artifacts"

      mkdir -p "$ARTIFACT_DIR"

      APK="$BUILD_DIR/apks/ChromePublic.apk"

      if [ ! -f "$APK" ]; then
        echo "Expected APK not found at: $APK"
        echo "Searching build output for APK files..."
        find "$BUILD_DIR" -type f -name '*.apk' -print || true

        echo "::error::Expected ChromePublic.apk was not generated."
        exit 1
      fi

      if [ ! -s "$APK" ]; then
        echo "::error::Generated APK is empty."
        exit 1
      fi

      cp "$APK" "$ARTIFACT_DIR/Orbit-Chromium-ARM64.apk"

      echo "Verified APK:"
      ls -lh "$ARTIFACT_DIR/Orbit-Chromium-ARM64.apk"

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: Orbit-Chromium-Android-ARM64
      path: orbit-artifacts/Orbit-Chromium-ARM64.apk
      if-no-files-found: error
      retention-days: 14

  - name: Build result
    if: always()
    shell: bash
    run: |
      {
        echo "## Orbit Chromium Build"
        echo ""
        echo "- Runner: self-hosted Linux x64"
        echo "- Target architecture: Android ARM64"
        echo "- Workflow status: ${{ job.status }}"
        echo ""
        echo "This workflow builds upstream Chromium."
        echo "It does not by itself integrate the Orbit app UI."
      } >> "$GITHUB_STEP_SUMMARY"
