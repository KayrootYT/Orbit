name: Android CI

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # only needed to attach the APK to a GitHub Release on tags

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # Works whether the Gradle project is at the repo root or inside a sub-folder (e.g. BudsyNative/).
      - name: Locate Gradle project
        run: |
          find_settings() { find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n 1; }
          SETTINGS=$(find_settings)
          # Fallback: project was uploaded to the repo as a .zip instead of extracted files.
          if [ -z "$SETTINGS" ]; then
            ZIP=$(find . -maxdepth 2 -name '*.zip' -not -path './.git/*' | head -n 1)
            if [ -n "$ZIP" ]; then
              echo "Found $ZIP - extracting it for the build"
              mkdir -p _unzipped && unzip -q "$ZIP" -d _unzipped
              SETTINGS=$(find _unzipped -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
            fi
          fi
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle(.kts) found. Repo layout:"; ls -R | head -50; exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Gradle project found in: $DIR"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # sdkmanager is installed on ubuntu-latest but is NOT on PATH, so locate it.
      - name: Prepare Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=$(find "$SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)
          echo "SDK=$SDK  sdkmanager=$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses > /dev/null || true
          "$SDKMANAGER" --sdk_root="$SDK" "platforms;android-35" "build-tools;35.0.0"

      # No gradle wrapper in the project, so install Gradle directly (AGP 8.7.3 needs Gradle 8.9+).
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
