name: Orbit Chromium Android ARM64

on:
workflow_dispatch:
push:
paths:
- "chromium-build/**"
- ".github/workflows/chromium-android.yml"

permissions:
contents: read

concurrency:
group: orbit-chromium-android
cancel-in-progress: false

jobs:
build-chromium:
name: Build Orbit Chromium ARM64
runs-on: [self-hosted, linux, x64, chromium-builder]
timeout-minutes: 360

env:
  ORBIT_CHROMIUM_ROOT: ${{ runner.home }}/orbit-chromium/src

steps:
  - name: Checkout Orbit repository
    uses: actions/checkout@v4

  - name: Check build environment
    shell: bash
    run: |
      set -euo pipefail
      echo "=== OS ==="
      uname -a
      echo "=== Disk space ==="
      df -h
      echo "=== RAM ==="
      free -h || true
      echo "=== Available tools ==="
      git --version
      python3 --version
      command -v java || true

      FREE_GB=$(df -BG "$HOME" | awk 'NR==2 {gsub("G","",$4); print $4}')
      if [ "${FREE_GB:-0}" -lt 100 ]; then
        echo "::error::Chromium build requires approximately 100 GB or more free disk space."
        exit 1
      fi

  - name: Build Chromium for Android ARM64
    shell: bash
    run: |
      set -euo pipefail
      chmod +x chromium-build/build_chromium_android.sh
      ./chromium-build/build_chromium_android.sh

  - name: Locate generated APKs
    id: apk
    shell: bash
    run: |
      set -euo pipefail

      BUILD_DIR="$ORBIT_CHROMIUM_ROOT/out/Orbit"
      mkdir -p "$GITHUB_WORKSPACE/orbit-artifacts"

      find "$BUILD_DIR" -type f -name '*.apk' -print

      find "$BUILD_DIR" -type f -name '*.apk' \
        -exec cp -v {} "$GITHUB_WORKSPACE/orbit-artifacts/" \;

      if ! find "$GITHUB_WORKSPACE/orbit-artifacts" \
        -maxdepth 1 -type f -name '*.apk' | grep -q .; then
        echo "::error::No APK was generated. Check the Chromium build logs."
        exit 1
      fi

      echo "APK files found:"
      ls -lh "$GITHUB_WORKSPACE/orbit-artifacts"

  - name: Upload Chromium APK artifacts
    uses: actions/upload-artifact@v4
    with:
      name: orbit-chromium-android-arm64
      path: orbit-artifacts/*.apk
      if-no-files-found: error
      retention-days: 14

  - name: Upload build summary
    if: always()
    uses: actions/upload-artifact@v4
    with:
      name: orbit-chromium-build-summary
      path: |
        ${{ env.ORBIT_CHROMIUM_ROOT }}/out/Orbit/args.gn
        ${{ env.ORBIT_CHROMIUM_ROOT }}/out/Orbit/build.ninja
      if-no-files-found: ignore
      retention-days: 7
